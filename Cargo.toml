[package]
name = "nook"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
dbus = "0.9"
glob = "0.3"
nix = { version = "0.31", features = ["fs", "user", "signal", "mount"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
signal-hook = "0.3"
tempfile = "3"
